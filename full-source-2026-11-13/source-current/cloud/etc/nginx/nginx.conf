user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
    server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;
	# 限流白名单 (工测平台用; 由 /usr/local/sbin/pentest-allow.sh 管理)
	# Cloudflare 真实客户端 IP (2026-10-07)
	real_ip_header CF-Connecting-IP;
	include /etc/nginx/cf-realip.conf;

	geo $rl_bypass {
	    default 0;
	    include /etc/nginx/pentest-allow.geo;
	}
	map $rl_bypass $rl_key {
	    default $binary_remote_addr;
	    1       "";
	}
	limit_req_zone $rl_key zone=loginzone:10m rate=10r/m;
    limit_req_zone $rl_key zone=chatazone:10m rate=300r/m;
	limit_req_status 429;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/ddos-mode.conf;
	include /etc/nginx/sites-enabled/*;
}


