# McGate 配置
backend:
  # 聊天室后端 (HTTPS)
  base-url: "https://chat.lzj2012.top/mc-api.php"
  # 与后端共享的密钥 (部署时写入, 不要提交到任何公开位置)
  secret: "CHANGE_ME"
  timeout-ms: 8000
gate:
  # 随机抽查概率 (0.0 ~ 1.0), 只对"已绑定"的玩家生效
  random-check-rate: 0.15
  # 冻结后多少秒未完成验证就踢出
  timeout-seconds: 900
  # 认证链接有效期由后端控制 (默认 900 秒)
  # 是否在解锁后执行 whitelist add
  whitelist-add: true
  # 提示文案
  message: "&c请点击下方认证链接完成验证：&e{code}"
  title: "&c访问受限"
  subtitle: "&f请到聊天室验证: chat.lzj2012.top"
  kick-reason: "&c验证超时。请到 chat.lzj2012.top 完成验证后再进服。"
  tos-message: "&c请打开 &fmcverify.lzj2012.top &c阅读并同意《用户协议》，同意后会自动解锁。"
  tos-title: "&c请先同意用户协议"
  tos-subtitle: "&f打开 mcverify.lzj2012.top"
  tos-kick-reason: "&c未同意用户协议。请打开 mcverify.lzj2012.top 同意后再进服。"
